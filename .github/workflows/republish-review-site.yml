name: Republish review site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (staging files)
        uses: actions/checkout@v4
        with:
          ref: main
          path: staging
      - name: Checkout gh-pages with history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: site
      - name: Restore site without Beat Maker and Solo Instrumentals
        run: |
          set -euo pipefail
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REVIEW=b73fe871d7aae3c006354e7793494cebcf6760e4
          git rm -rf --quiet .
          git checkout "$REVIEW" -- .
          # updated text files
          cp ../staging/.publish-staging/index.html index.html
          cp ../staging/.publish-staging/README.md README.md
          cp ../staging/.publish-staging/styles.css css/styles.css
          cp ../staging/.publish-staging/app.js js/app.js
          cp ../staging/.publish-staging/search.js js/search.js
          cp ../staging/.publish-staging/config.js js/config.js
          # removed features
          git rm -f css/beatmaker.css js/beatgen.js js/beatmaker.js js/tracks.js js/peaks.js
          git rm -rf audio
          check() {
            local path="$1" expected="$2"
            local got
            got=$(git hash-object "$path")
            if [ "$got" != "$expected" ]; then
              echo "hash mismatch $path: $got != $expected"
              exit 1
            fi
            echo "ok $path $got"
          }
          check index.html f2527fdec98390e5d95736e755ae7ca94e5d389f
          check README.md f1e81010ab4d64b57b4808556960d340453a06a6
          check css/styles.css 15d1df0a2c873a968ec277b4c0bf84afc53d5977
          check css/curriculum.css 2204abd9e54945f16e5735930631ce7af85264ce
          check js/app.js d215ce4015cfcf9e8b7167c3e071a2d23d702058
          check js/config.js e342b4a0457f348b6282ca28175cc51b29202e31
          check js/search.js b0715c751025577b4e9ece376c3bc93df80e2f50
          check js/curriculum-data.js 284f730b66a7c1c70e66a2aa1d827970386bb875
          check js/curriculum.js c93e080ad21150468887c31040dbf1b928e66a67
          check js/roster.js bc0fc7feab8d9a377ea879d723021bda376edf10
          check assets/senquiii-red.jpg cbb03471fbb3bae0dee043da0b646dabaaaf34b3
          check assets/senquiii-blue.jpg 1e9982949b12a0e6cd63afd87277f4a3dd9232e1
          check assets/favicon.svg a23b0f3b7ef5233b93f4fa4a01ad4976ffc75d28
          for gone in css/beatmaker.css js/beatgen.js js/beatmaker.js js/tracks.js js/peaks.js audio; do
            if [ -e "$gone" ]; then
              echo "still present: $gone"
              exit 1
            fi
            echo "gone $gone"
          done
          git add -A
          git status
          git commit -m "Republish SENQUIII Music Lab without Beat Maker and Solo Instrumentals"
          git push origin gh-pages
      - name: Remove temporary workflow and staging from main
        if: success()
        run: |
          set -euo pipefail
          cd staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/republish-review-site.yml
          git rm -rf .publish-staging
          git commit -m "Remove temporary republish workflow and staging files"
          git push origin main
