name: Republish review site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages with history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Restore review site without the artist-split section
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REVIEW=623f0e9bacbf3787d0210c03455b0af3de897f06
          git rm -rf --quiet .
          git checkout "$REVIEW" -- .
          python3 <<'PY'
          from pathlib import Path
          p = Path("index.html")
          text = p.read_text()
          start = text.find('      <aside class="terms-box">')
          end = text.find("      </aside>\n", start)
          if start == -1 or end == -1:
              raise SystemExit("terms-box not found")
          end = end + len("      </aside>\n")
          p.write_text(text[:start] + text[end:])
          print("removed terms-box", start, "to", end)
          PY
          INDEX_SHA=$(git hash-object index.html)
          if [ "$INDEX_SHA" != "eecc5fa35277e642a0bd45c755d209782b6a56c7" ]; then
            echo "index.html hash mismatch: $INDEX_SHA"
            exit 1
          fi
          git add -A
          git commit -m "Republish SENQUIII Music Lab for review (split section removed)"
          git push origin gh-pages
